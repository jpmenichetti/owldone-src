name: Edge Functions Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  deno-tests:
    name: Run Deno tests for supabase/functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Deno installation
        run: deno --version

      - name: Run all edge function tests
        # Recursively discovers *_test.ts and *.test.ts files under supabase/functions.
        # --allow-net and --allow-env match the runtime permissions used by the
        # Lovable test runner so behavior stays consistent with local runs.
        run: deno test --allow-net --allow-env --no-check supabase/functions/
